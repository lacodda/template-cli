# How {{ name }} is released, read by furca's release engine: `furca release
# plan` says what the next release is and what stands in its way, `furca
# release run` carries it out - bump, changelog, gate, commit, push, green CI,
# tag, publish - and checks what went out. `lyrn check` reads it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "{{ name }}"
changelog = "CHANGELOG.md"
# The crate, and the npm wrapper that downloads its binary from the release.
manifests = ["Cargo.toml", "npm/package.json"]
# ADRs record what happened: the versions they name are history.
as_written = ["docs/adr/"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
publish = "publish.yml"

[[package]]
registry = "crates"
name = "{{ name }}"
manifest = "Cargo.toml"

[[package]]
registry = "npm"
name = "{{ name }}"
manifest = "npm/package.json"
wraps = "{{ name }}"

# The files the tag's release page has to carry: checked after the publish,
# and against the targets the installers ask for on every commit.
[page]
assets = [
    "{{ name }}-{tag}-x86_64-pc-windows-msvc.zip",
    "{{ name }}-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "{{ name }}-{tag}-aarch64-apple-darwin.tar.gz",
]

# The program is installed from the release by tools/install.ps1 and
# tools/install.sh, and proven to be the release's own build.
[post.install]
