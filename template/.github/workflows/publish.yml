name: Publish

# Started by the tag push itself, not by the release event: release.yml
# creates the release with GITHUB_TOKEN, and such events start no other
# workflow. workflow_dispatch publishes a tag again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true

permissions: {}

jobs:
  # Nothing goes to a registry before the release is out. An npm wrapper
  # downloads its binary from the release page, so a package published first
  # answers `npm install` with a 404 until the archives arrive; and a release
  # that failed to build should reach no registry at all. Every job below
  # needs this one.
  release:
    name: Wait for the release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - name: Wait for release.yml on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          started=$(date +%s)
          while :; do
            run=$(gh run list --workflow release.yml --commit "$sha" --limit 1 \
              --json status,conclusion,url --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.url // "-")"')
            read -r status conclusion url <<< "$run"
            case "$status/$conclusion" in
              completed/success) echo "release.yml put $TAG out: $url"; exit 0 ;;
              completed/*) echo "release.yml ended '$conclusion' for $TAG: $url" >&2; exit 1 ;;
              none/*)
                if [ $(( $(date +%s) - started )) -gt 600 ]; then
                  echo "release.yml has not started for $TAG in ten minutes" >&2
                  exit 1
                fi
                ;;
            esac
            sleep 30
          done
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # A version is published once: a re-run - after the first publish by
      # hand, or for a tag pushed again - skips it instead of failing on it.
      - name: Check whether this version is on crates.io
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf "https://crates.io/api/v1/crates/{{ name }}/$version" -H 'user-agent: {{ name }}-publish' > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "{{ name }} $version is on crates.io already"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The first publish of a crate is by hand: a trusted publisher cannot be
      # attached to a crate that does not exist yet. Set one up on crates.io
      # after that first release, and this job takes over.
      - name: Get a crates.io token (OIDC trusted publishing)
        if: steps.check.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.check.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The wrapper that downloads the binary from the release page - which is why
  # it waits for the release above.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # npm >= 11.5.1 exchanges the OIDC token itself (trusted publishing);
      # provenance is attached automatically.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      # The first publish is by hand, as for the crate; a version npm holds
      # already is skipped.
      - name: Publish
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "{{ name }}@$version" version > /dev/null 2>&1; then
            echo "{{ name }}@$version is on npm already"
          else
            npm publish
          fi
